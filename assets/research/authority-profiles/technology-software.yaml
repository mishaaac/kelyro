contract_version: authority-profiles/v1
profiles:
  - id: authority.technology-software.default
    version: technology-software/v1
    domain: software
    topic_pattern: "*"
    preferred_source_kinds:
      - specification
      - official_documentation
      - standard
      - package_reference
      - release_notes
      - source_code
    minimum_corroboration: 1
    allowed_supplementary_kinds:
      - official_blog
      - official_tutorial
      - paper
      - book_reference
      - community_article
