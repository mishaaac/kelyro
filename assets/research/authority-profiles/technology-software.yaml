      - specification
      - official_documentation
      - package_reference
      - release_notes
      - source_code
    preferred_domains:
      - go.dev
      - pkg.go.dev
      - github.com
    preferred_organizations:
      - Go project
      - golang
    minimum_corroboration: 1
    allowed_supplementary_kinds:
      - official_blog
      - official_tutorial
      - issue_tracker
    freshness_ttl_hints:
      - claim_type: security
        ttl_days: 14
      - source_kind: release_notes
        ttl_days: 21
